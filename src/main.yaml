name: Test, Build and Push to Google Cloud

on:
  push:
  workflow_dispatch:
    branches:
      -"main"

jobs:
  tests:
    run-on: ubuntu-latest
    matrix:
      python-version: ["3.8","3.9","3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with: 
          python-version: "3.12"
      - name: Install requirements
        run: |
            python -m pip install -r src/requirements.txt
      - name: Run tests
        env: 
          MODE: "github actions"
        run: |
          pytest src/tests.py


  
  build_deploy:
    run-on: ubuntu-latest
  
