name: Deploy GCP Infrastructure (Terraform)

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  IMAGE_NAME: basicragapp
  TF_WORKING_DIR: infra/environments/prod
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}

jobs:
  build-and-plan:
    # Only run for PRs from 'dev' that were actually merged into 'main'.
    if: github.event.pull_request.merged == true && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read # Added so dorny/paths-filter can read the PR diff API
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. NEW: Check if backend or frontend directories changed in this PR
      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'frontend/**'
              - 'src/**'
              - 'vector_db/**'
              - 'prompts/**'

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 2. MODIFIED: Set the image tag conditionally based on the filter output
      - name: Set image tag and build flag
        id: image
        run: |
          BASE_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          
          if [ "${{ steps.filter.outputs.app }}" == "true" ]; then
            echo "Source changed. Will build and push a new image."
            echo "image=${BASE_IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source changes detected. Skipping build and fetching the latest image from GCP..."
            
            # Fetch the digest of the most recently updated image in Artifact Registry
            LATEST_DIGEST=$(gcloud artifacts docker images list $BASE_IMAGE \
              --sort-by="~UPDATE_TIME" \
              --limit=1 \
              --format="value(version)")
            
            # Pass the existing digest to Terraform so the state remains intact
            echo "image=${BASE_IMAGE}@${LATEST_DIGEST}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. MODIFIED: Only execute Docker build/push if 'build' was evaluated to true
      - name: Build Docker image
        if: steps.image.outputs.build == 'true'
        run: docker build -t ${{ steps.image.outputs.image }} .

      - name: Push Docker image
        if: steps.image.outputs.build == 'true'
        run: docker push ${{ steps.image.outputs.image }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -var="app_container_image=${{ steps.image.outputs.image }}"
        
      - name: Show Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  apply:
    needs: build-and-plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan