name: Terraform Apply (prod)

on:
  pull_request:
    branches:
      - prod
    paths:
      - "infra/environments/prod/**"
      - "infra/modules/**"

permissions:
  contents: read
  id-token: write # required for keyless GCP auth via Workload Identity Federation

env:
  TF_WORKING_DIR: infra/environments/prod
  TF_VAR_qdrant_api_key: ${{ secrets.QDRANT_API_KEY }}
  TF_VAR_qdrant_allowed_source_ranges: ${{ secrets.QDRANT_ALLOWED_SOURCE_RANGES }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses Workload Identity Federation (no long-lived key) with a
      # least-privilege service account scoped to this project's Terraform resources.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
