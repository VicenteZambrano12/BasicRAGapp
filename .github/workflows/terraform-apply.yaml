name: Deploy (prod)

# Single pipeline: on a PR from dev into main, build the app image, then
# apply Terraform (which deploys that image to Cloud Run) so every modified
# resource - infra and app code - is updated together.
on:
  workflow_dispatch: # allows a manual one-off run, e.g. to verify the pipeline
  pull_request:
    branches:
      - main
    paths:
      - "infra/environments/prod/**"
      - "infra/modules/**"
      - "src/**"
      - "vector_db/**"
      - "prompts/**"
      - "frontend/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/terraform-apply.yaml"

permissions:
  contents: write # allows the workflow to push commits/branches (e.g. for automated secret-creation PRs)
  pull-requests: write # allows the workflow to open/update PRs
  id-token: write # required for keyless GCP auth via Workload Identity Federation

env:
  TF_WORKING_DIR: infra/environments/prod
  # project_id/region are not sensitive - they match the committed defaults in
  # infra/environments/prod/variables.tf and terraform.tfvars, so no secret is needed.
  PROJECT_ID: basicrahgapp
  REGION: europe-southwest1
  REPOSITORY: basicragapp
  SERVICE: basicragapp-app
  # CIDR ranges aren't credentials, so this is a repo Variable, not a Secret.
  TF_VAR_qdrant_allowed_source_ranges: ${{ vars.QDRANT_ALLOWED_SOURCE_RANGES }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses Workload Identity Federation (no long-lived key) with a
      # least-privilege service account scoped to this project's resources.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and push app image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "TF_VAR_app_container_image=$IMAGE" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      # Cloud Run keeps every revision indefinitely; only the last two stay,
      # the rest are deleted to control clutter/cost.
      - name: Prune old Cloud Run revisions
        run: |
          gcloud run revisions list \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --service "${{ env.SERVICE }}" \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" \
          | tail -n +3 \
          | xargs -r -n1 gcloud run revisions delete --project "${{ env.PROJECT_ID }}" --region "${{ env.REGION }}" --quiet
