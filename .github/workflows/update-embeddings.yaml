name: Git-Based Zip Ingestion to Qdrant

on:
  workflow_dispatch:
    # Manual trigger so it doesn't run on every push

jobs:
  process-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP from Repository
        run: |
          # Unzips the file that is already in your repo
          unzip content.zip -d ./extracted_content/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Qdrant Ingestion
        env:
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GCP_API_KEY }}
          CONTENT_DIRECTORY: './extracted_content'
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Configure GEMINI_API_KEY, GOOGLE_API_KEY, or GCP_API_KEY in GitHub repository secrets."
            exit 1
          fi
          python ingest.py