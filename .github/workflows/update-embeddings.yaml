name: Git-Based Zip Ingestion to Qdrant

on:
  workflow_dispatch:
    # Manual trigger so it doesn't run on every push

jobs:
  process-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP from Repository
        run: |
          # Unzips the file that is already in your repo
          unzip content.zip -d ./extracted_content/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate Google Cloud Service Account
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p config
          echo "$GCP_SA_KEY" > config/basicrahgapp-d65b3bda1f4a.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=config/basicrahgapp-d65b3bda1f4a.json" >> $GITHUB_ENV
          echo "GOOGLE_GENAI_USE_ENTERPRISE=true" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_PROJECT=basicrahgapp" >> $GITHUB_ENV
          echo "GOOGLE_CLOUD_LOCATION=us-central1" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Qdrant Ingestion
        env:
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          CONTENT_DIRECTORY: './extracted_content'
        run: |
          if [ -z "$QDRANT_URL" ] && [ -n "$QDRANT_HOST" ]; then
            case "$QDRANT_HOST" in
              http://*|https://*) QDRANT_URL="$QDRANT_HOST" ;;
              *) QDRANT_URL="https://$QDRANT_HOST" ;;
            esac
            export QDRANT_URL
          fi
          python ingest.py