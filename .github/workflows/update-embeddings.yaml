name: Independent Zip Ingestion to Qdrant & GCS

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct download URL for the ZIP file containing your folders'
        required: true
        type: string

jobs:
  process-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download and Extract ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o docs.zip
          unzip docs.zip -d ./extracted_content/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync to GCS (S3 Equivalent)
        # gsutil rsync -d deletes files in the bucket that are NOT in the extracted folder
        run: |
          gsutil rsync -d -r ./extracted_content/ gs://${{ secrets.GCS_BUCKET_NAME }}/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Run Qdrant Ingestion
        env:
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTENT_DIRECTORY: './extracted_content'
        run: python ingest.py